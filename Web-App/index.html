<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FTW Segment Explorer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="https://js.arcgis.com/4.32/esri/themes/light/main.css" />
    <link rel="stylesheet" href="./styles.css?v=2026-10-21-5" />
    <script src="https://js.arcgis.com/4.32/"></script>
  </head>
  <body>
    <div class="app-shell">
      <aside class="panel filters-panel">
        <div class="panel-header">
          <h1>FTW Segment Explorer</h1>
          <p class="panel-copy">
            Pick a segment to read its limits and CSJs. Pick a CSJ to see it on the map and both TxDOT wordings.
          </p>
        </div>
        <div class="category-list" id="category-list" aria-label="Highway system filters"></div>
      </aside>

      <section class="panel segments-panel">
        <div class="panel-header">
          <p class="eyebrow">Selection</p>
          <h2>FTW segments</h2>
          <p class="panel-copy">
            Select segments to draw them on the map and zoom to their limits.
          </p>
        </div>

        <div class="toolbar">
          <label class="search-field" for="segment-search">
            <span class="sr-only">Search segments and CSJs</span>
            <input
              id="segment-search"
              type="search"
              placeholder="Search segment, CSJ or limits"
              autocomplete="off"
            />
          </label>

          <div class="status-row">
            <p id="list-status" class="list-status" role="status">Loading segments...</p>
            <label class="differ-check">
              <input id="differ-filter" type="checkbox" disabled />
              <span id="differ-label">Only CSJs whose limits differ (loading)</span>
            </label>
          </div>

          <div class="toolbar-actions">
            <button id="clear-selection" class="ghost-button" type="button" disabled>Clear</button>
            <button id="zoom-selected" class="primary-button" type="button" disabled>Zoom to selection</button>
          </div>
        </div>

        <div class="summary-strip">
          <div class="summary-card">
            <span class="summary-label">Visible</span>
            <strong id="visible-count">0</strong>
          </div>
          <div class="summary-card">
            <span class="summary-label">Selected</span>
            <strong id="selected-count">0</strong>
          </div>
        </div>

        <div class="segment-list" id="segment-list">
          <div class="empty-state">Loading segments...</div>
        </div>
      </section>

      <main class="map-panel">
        <div id="viewDiv" class="map-view" aria-label="Map view"></div>
      </main>
    </div>

    <script src="./app.js?v=2026-10-21-5"></script>
  </body>
</html>
